name: Verify Windows candidate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify upstream inventory and UI regressions
        run: |
          python3 scripts/verify-components.py
          python3 scripts/check-ui-contract.py
      - name: Test native models and editor policy
        run: |
          dotnet restore desktop-tests/CoreTests.csproj --locked-mode
          dotnet run --no-restore --project desktop-tests/CoreTests.csproj -c Release
          dotnet restore desktop/UI/Tests/EditorPolicyTests.csproj --locked-mode
          dotnet run --no-restore --project desktop/UI/Tests/EditorPolicyTests.csproj -c Release
      - name: Compare two clean builds
        run: python3 scripts/check-reproducible.py --output dist-dotnet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QRA-Config-unsigned-${{ github.sha }}
          path: dist-dotnet/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      # No signing, release upload, S3 access or submission in this workflow.
